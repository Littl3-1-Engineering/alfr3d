<svg width="100%" viewBox="0 0 680 590" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ALFR3D learners and situational awareness architecture</title>
<desc>Sources feed a slow nightly learner path (bronze, silver, gold, learners) that writes profiles to MySQL. A fast 60 second awareness loop scores them, fuses layer 2 inferences and publishes cards to the Deck and web dashboard. A dashed feedback path from cards back to the lake is captured but not yet learned from.</desc>
<defs>
<style>
  .bg{fill:#ffffff}
  .th{font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1f2328}
  .ts{font:400 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#59636e}
  .gray rect{fill:#f0f1f3;stroke:#8b949e}
  .purple rect{fill:#efeafc;stroke:#7c5cd6}
  .teal rect{fill:#e3f5f1;stroke:#1d9a82}
  .arr{stroke:#59636e;stroke-width:1.5;fill:none}
  .fb{fill:none;stroke:#bf6b00;stroke-width:1.5;stroke-dasharray:5 4}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .th{fill:#f0f6fc}
    .ts{fill:#9198a1}
    .gray rect{fill:#21262d;stroke:#6e7681}
    .purple rect{fill:#2a2250;stroke:#a48bf0}
    .teal rect{fill:#10372f;stroke:#3dc9ab}
    .arr{stroke:#9198a1}
    .fb{stroke:#e3a13a}
  }
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect class="bg" width="680" height="590" rx="12"/>

<g class="gray"><rect x="40" y="16" width="130" height="48" rx="8" stroke-width="0.8"/><text class="th" x="105" y="34" text-anchor="middle" dominant-baseline="central">Network scans</text><text class="ts" x="105" y="52" text-anchor="middle" dominant-baseline="central">phones, devices</text></g>
<g class="gray"><rect x="190" y="16" width="130" height="48" rx="8" stroke-width="0.8"/><text class="th" x="255" y="34" text-anchor="middle" dominant-baseline="central">Calendar</text><text class="ts" x="255" y="52" text-anchor="middle" dominant-baseline="central">busy windows</text></g>
<g class="gray"><rect x="340" y="16" width="130" height="48" rx="8" stroke-width="0.8"/><text class="th" x="405" y="34" text-anchor="middle" dominant-baseline="central">Deck app</text><text class="ts" x="405" y="52" text-anchor="middle" dominant-baseline="central">network, attention</text></g>
<g class="gray"><rect x="490" y="16" width="130" height="48" rx="8" stroke-width="0.8"/><text class="th" x="555" y="34" text-anchor="middle" dominant-baseline="central">Home Assistant</text><text class="ts" x="555" y="52" text-anchor="middle" dominant-baseline="central">ESPHome, Gmail</text></g>
<line x1="340" y1="64" x2="340" y2="98" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="40" y="100" width="600" height="130" rx="16" stroke-width="0.8"/><text class="th" x="60" y="122">sa-learner: slow path, nightly</text></g>
<g class="purple"><rect x="60" y="146" width="120" height="60" rx="8" stroke-width="0.8"/><text class="th" x="120" y="167" text-anchor="middle" dominant-baseline="central">Bronze</text><text class="ts" x="120" y="187" text-anchor="middle" dominant-baseline="central">raw Parquet</text></g>
<g class="purple"><rect x="204" y="146" width="120" height="60" rx="8" stroke-width="0.8"/><text class="th" x="264" y="167" text-anchor="middle" dominant-baseline="central">Silver</text><text class="ts" x="264" y="187" text-anchor="middle" dominant-baseline="central">cleaned, merged</text></g>
<g class="purple"><rect x="348" y="146" width="120" height="60" rx="8" stroke-width="0.8"/><text class="th" x="408" y="167" text-anchor="middle" dominant-baseline="central">Gold</text><text class="ts" x="408" y="187" text-anchor="middle" dominant-baseline="central">feature grids</text></g>
<g class="purple"><rect x="492" y="146" width="130" height="60" rx="8" stroke-width="0.8"/><text class="th" x="557" y="167" text-anchor="middle" dominant-baseline="central">9 learner fits</text><text class="ts" x="557" y="187" text-anchor="middle" dominant-baseline="central">fit, then drift cap</text></g>
<line x1="180" y1="176" x2="202" y2="176" class="arr" marker-end="url(#arrow)"/>
<line x1="324" y1="176" x2="346" y2="176" class="arr" marker-end="url(#arrow)"/>
<line x1="468" y1="176" x2="490" y2="176" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="230" x2="340" y2="254" class="arr" marker-end="url(#arrow)"/>

<g class="gray"><rect x="190" y="256" width="300" height="44" rx="8" stroke-width="0.8"/><text class="th" x="340" y="278" text-anchor="middle" dominant-baseline="central">MySQL: sa_profiles, sa_inferences</text></g>
<line x1="340" y1="300" x2="340" y2="324" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="40" y="326" width="600" height="130" rx="16" stroke-width="0.8"/><text class="th" x="60" y="348">sa-awareness: fast path, every 60 s</text></g>
<g class="teal"><rect x="60" y="370" width="120" height="60" rx="8" stroke-width="0.8"/><text class="th" x="120" y="391" text-anchor="middle" dominant-baseline="central">Context frame</text><text class="ts" x="120" y="411" text-anchor="middle" dominant-baseline="central">live state</text></g>
<g class="teal"><rect x="204" y="370" width="120" height="60" rx="8" stroke-width="0.8"/><text class="th" x="264" y="391" text-anchor="middle" dominant-baseline="central">Layer 1</text><text class="ts" x="264" y="411" text-anchor="middle" dominant-baseline="central">p and confidence</text></g>
<g class="teal"><rect x="348" y="370" width="120" height="60" rx="8" stroke-width="0.8"/><text class="th" x="408" y="391" text-anchor="middle" dominant-baseline="central">Layer 2</text><text class="ts" x="408" y="411" text-anchor="middle" dominant-baseline="central">families vote once</text></g>
<g class="teal"><rect x="492" y="370" width="130" height="60" rx="8" stroke-width="0.8"/><text class="th" x="557" y="391" text-anchor="middle" dominant-baseline="central">26 card rules</text><text class="ts" x="557" y="411" text-anchor="middle" dominant-baseline="central">priority, suppression</text></g>
<line x1="180" y1="400" x2="202" y2="400" class="arr" marker-end="url(#arrow)"/>
<line x1="324" y1="400" x2="346" y2="400" class="arr" marker-end="url(#arrow)"/>
<line x1="468" y1="400" x2="490" y2="400" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="456" x2="340" y2="484" class="arr" marker-end="url(#arrow)"/>

<g class="gray"><rect x="190" y="486" width="300" height="44" rx="8" stroke-width="0.8"/><text class="th" x="340" y="508" text-anchor="middle" dominant-baseline="central">Cards on Deck and web</text></g>
<path class="fb" d="M190 508 L22 508 L22 176 L58 176" marker-end="url(#arrow)"/>
<text class="ts" x="40" y="560">Dashed: card feedback is captured (card_interactions), but no learner reads it yet</text>
</svg>
