apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-environment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-environment
  template:
    metadata:
      labels:
        app: service-environment
    spec:
       securityContext:
         runAsNonRoot: true
         runAsUser: 1000
         runAsGroup: 1000
       containers:
       - name: service-environment
         image: alfr3d/service-environment:v0.2.0
         imagePullPolicy: Never
         securityContext:
           allowPrivilegeEscalation: false
           readOnlyRootFilesystem: true
           capabilities:
             drop: ["ALL"]
         envFrom:
         - configMapRef:
             name: alfr3d-k8s-env
