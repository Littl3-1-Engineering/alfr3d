apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfr3d-service-speak
  labels:
    app: alfr3d-service-speak
  annotations:
    checkov.io/skip1: CKV_K8S_23=entrypoint.sh needs root briefly to chown /tmp/audio before dropping to alfr3d via gosu; capabilities are restricted to CHOWN/SETUID/SETGID
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alfr3d-service-speak
  template:
    metadata:
      labels:
        app: alfr3d-service-speak
    spec:
      containers:
      - name: speak
        image: alfr3d-service-speak:v0.2.0
        imagePullPolicy: Never
        # entrypoint.sh chowns /tmp/audio then drops to a non-root user via gosu,
        # so it needs to start as root -- not eligible for runAsNonRoot at the pod level.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "SETUID", "SETGID"]
        env:
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: alfr3d-config
              key: mysql-database
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: alfr3d-secrets
              key: mysql-user
        - name: MYSQL_PSWD
          valueFrom:
            secretKeyRef:
              name: alfr3d-secrets
              key: mysql-password
        - name: MYSQL_NAME
          valueFrom:
            configMapKeyRef:
              name: alfr3d-config
              key: mysql-database-name
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: alfr3d-config
              key: kafka-bootstrap-servers
        - name: ALFR3D_ENV_NAME
          valueFrom:
            configMapKeyRef:
              name: alfr3d-config
              key: alfr3d-env-name
        - name: LOG_LEVEL
          value: INFO
        - name: AUDIO_STORAGE_PATH
          value: /tmp/audio
        - name: AUDIO_RETENTION_MINUTES
          value: "5"
        - name: COQUI_TOS_AGREED
          value: "1"
        volumeMounts:
        - name: audio-storage
          mountPath: /tmp/audio
      volumes:
      - name: audio-storage
        emptyDir: {}
