apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-daemon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-daemon
  template:
    metadata:
      labels:
        app: service-daemon
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
      - name: wait-for-kafka
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done;']
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      containers:
      - name: service-daemon
        image: alfr3d/service-daemon:v0.2.0
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        envFrom:
        - configMapRef:
            name: alfr3d-k8s-env
