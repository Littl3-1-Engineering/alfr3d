# Docker Compose configuration for ALFR3D services
# Enable BuildKit for faster builds: export DOCKER_BUILDKIT=1
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME}
    ports:
      - "${ZOOKEEPER_CLIENT_PORT}:${ZOOKEEPER_CLIENT_PORT}"
    # Named, not the image's own anonymous VOLUMEs. Kafka's topic metadata, consumer group
    # registry and broker registration all live in ZK's data dir, so an anonymous volume put
    # the whole event bus one `down -v` (or `up -V`) away from silently starting empty.
    # Migrated 2026-09-22; /etc/zookeeper/secrets stays anonymous, it is an empty cert mount.
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    # `srvr` over the 4-letter-word port, not the more obvious `ruok`: this image ships with
    # only `srvr` allowlisted, and widening 4lw.commands.whitelist would mean recreating the
    # broker's own dependency for a cosmetically nicer probe. Grepping for "Mode" confirms ZK
    # is actually serving (standalone/leader/follower), not merely accepting a connection.
    healthcheck:
      test: [ "CMD-SHELL", "echo srvr | nc -w 2 localhost ${ZOOKEEPER_CLIENT_PORT} | grep -q Mode" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    restart: unless-stopped
    # Kafka depends on Zookeeper for cluster coordination and metadata management
    depends_on:
      - zookeeper
    environment:
      - KAFKA_BROKER_ID=${KAFKA_BROKER_ID}
      - KAFKA_ZOOKEEPER_CONNECT=${KAFKA_ZOOKEEPER_CONNECT}
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_LISTENERS=INTERNAL:${KAFKA_LISTENERS_1},EXTERNAL:${KAFKA_LISTENERS_2}
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL:${KAFKA_ADVERTISED_LISTENERS_1},EXTERNAL:${KAFKA_ADVERTISED_LISTENERS_2}
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      - KAFKA_CREATE_TOPICS=speak:1:1,environment:1:1,device:1:1,user:1:1,google:1:1,event-stream:1:1,situational-awareness:1:1,integrations:1:1,personality:1:1
      # This host has no UPS and sees occasional power loss. Kafka normally leaves fsync
      # to the OS page cache, so an unclean shutdown can truncate whatever hadn't been
      # flushed yet (confirmed 2026-09-25: 5 partitions lost their unflushed tail after a
      # power outage). At this daemon's message volume, fsyncing every message is free.
      - KAFKA_LOG_FLUSH_INTERVAL_MESSAGES=1
      - KAFKA_LOG_FLUSH_INTERVAL_MS=1000
    ports:
      - "9092:9092"
    # Same reasoning as zookeeper above: this holds every topic's log segments and the
    # __consumer_offsets partitions, and was on an anonymous volume until 2026-09-22.
    volumes:
      - kafka_data:/var/lib/kafka/data
    # Healthcheck ensures Kafka is ready to accept connections
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_NAME}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PSWD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./setup/my.cnf:/etc/mysql/conf.d/slow_query.cnf
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PSWD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrate:
    profiles: ["test"]
    build:
      context: ./setup
      dockerfile: ./migrations/Dockerfile
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      - MYSQL_DATABASE=mysql
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PSWD=${MYSQL_PSWD}
      - MYSQL_NAME=${MYSQL_NAME}

  service-user:
    build:
      context: ./services
      dockerfile: ./service_user/Dockerfile
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_started
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS_1}
      - LOG_LEVEL=${LOG_LEVEL}
    healthcheck:
      # Mirrors HEARTBEAT_PATH in service_user/app.py - the consumer touches the file on every
      # connect attempt and poll cycle, so a stale file means it's wedged (e.g. blocked in a
      # Kafka connect at boot) even though the process is still running.
      test: [ "CMD", "python", "-m", "common.heartbeat", "/tmp/user_heartbeat", "90" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  service-api:
    build:
      context: ./services
      dockerfile: ./service_api/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - audio_data:/tmp/audio
      - secrets_data:/secrets
      - .:/project:ro
    privileged: true
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS_1}
      - LOG_LEVEL=${LOG_LEVEL}
    expose:
      - "5001"
    ports:
      - "5001:5001"
    healthcheck:
      # This image has no curl/wget, so probe with the interpreter that's already here.
      # /api/health is unauthenticated by design and reports the API's own liveness.
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5001/api/health', timeout=5).status == 200 else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  service-device:
    build:
      context: ./services
      dockerfile: ./service_device/Dockerfile
    # Host network mode and root required for ARP scanning
    network_mode: host
    restart: unless-stopped
    volumes:
      - secrets_data:/secrets
    env_file: .env
    environment:
      - MYSQL_DATABASE=localhost
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS_2}
      - LOG_LEVEL=${LOG_LEVEL}
    healthcheck:
      # Mirrors HEARTBEAT_PATH in service_device/app.py. A file probe rather than a port probe
      # matters here: this service runs with network_mode: host, so there's no container-local
      # port that would distinguish it from anything else on the host.
      test: [ "CMD", "python", "-m", "common.heartbeat", "/tmp/device_heartbeat", "90" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  service-environment:
    build:
      context: ./services
      dockerfile: ./service_environment/Dockerfile
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_started
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS_1}
      - LOG_LEVEL=${LOG_LEVEL}
    healthcheck:
      # Mirrors HEARTBEAT_PATH in service_environment/environment.py.
      test: [ "CMD", "python", "-m", "common.heartbeat", "/tmp/environment_heartbeat", "90" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  service-speak:
    build:
      context: ./services
      dockerfile: ./service_speak/Dockerfile
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS_1}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - audio_data:/tmp/audio
      - secrets_data:/secrets
    healthcheck:
      # Mirrors HEARTBEAT_STALE_SECONDS in service_speak/app.py - the consumer thread touches
      # /tmp/speak_heartbeat on every connect attempt and poll cycle, so a stale file means it's
      # stuck (e.g. hung connecting to Kafka at boot) even though the process is still running.
      test: [ "CMD", "python", "-c", "import os,sys,time; p='/tmp/speak_heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 90 else 1)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  service-daemon:
    build:
      context: ./services
      dockerfile: ./service_daemon/Dockerfile
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_started
    network_mode: host
    env_file: .env
    environment:
      - MYSQL_DATABASE=localhost
      - KAFKA_BOOTSTRAP_SERVERS=localhost:9092
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - secrets_data:/secrets
    healthcheck:
      # Mirrors HEARTBEAT_PATH/HEARTBEAT_STALE_SECONDS in service_daemon/alfr3ddaemon.py. The
      # window is 300s, not 90s, because one MyDaemon.run() cycle is a 60s sleep plus the
      # routine and situational-awareness work - 90s would flap on an ordinary slow pass.
      test: [ "CMD", "python", "-m", "common.heartbeat", "/tmp/daemon_heartbeat", "300" ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  # SA-6: self-hosted routing (check_travel()). Opt-in via the "routing" profile -- not started
  # by default, since it needs real regional OSRM data (see setup/build_routing_extract.sh) that
  # doesn't exist until someone provisions it for their own location. Without this profile
  # active, routing_utils.get_route() simply can't connect and check_travel() degrades to no
  # card, same as any other missing optional integration in this file.
  routing:
    profiles: ["routing"]
    image: ghcr.io/project-osrm/osrm-backend:latest
    restart: unless-stopped
    command: >
      osrm-routed --algorithm mld /data/${ROUTING_REGION_NAME:-region}.osrm
    ports:
      - "5005:5000"
    volumes:
      - ./routing_data:/data
    # The image really does lack curl/wget/nc (verified 2026-09-22, superseding an earlier
    # note that only suspected it), but it does ship bash, so /dev/tcp gives a real HTTP
    # round trip rather than a bare port check: a listening-but-wedged osrm-routed still
    # fails to return a status line.
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /nearest/v1/driving/0,0 HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q HTTP" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  service-frontend:
    build:
      context: ./services/service_frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    user: "1001:1001"
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      service-frontend:
        condition: service_started
      service-api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Separate MySQL instance for testing to avoid interfering with production data
  test-mysql:
    profiles: ["test"]
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: testrootpassword  # pragma: allowlist secret -- ephemeral CI-only db, not a real credential
      MYSQL_DATABASE: test_alfr3d_db
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

# Named volumes for persistent data storage
volumes:
  mysql_data:
  audio_data:
  redis_data:
  secrets_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
