# Docker Compose configuration for ALFR3D services
# Enable BuildKit for faster builds: export DOCKER_BUILDKIT=1
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME}
    ports:
      - "${ZOOKEEPER_CLIENT_PORT}:${ZOOKEEPER_CLIENT_PORT}"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    # Kafka depends on Zookeeper for cluster coordination and metadata management
    depends_on:
      - zookeeper
    environment:
      - KAFKA_BROKER_ID=${KAFKA_BROKER_ID}
      - KAFKA_ZOOKEEPER_CONNECT=${KAFKA_ZOOKEEPER_CONNECT}
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_LISTENERS=INTERNAL:${KAFKA_LISTENERS_1},EXTERNAL:${KAFKA_LISTENERS_2}
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL:${KAFKA_ADVERTISED_LISTENERS_1},EXTERNAL:${KAFKA_ADVERTISED_LISTENERS_2}
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      - KAFKA_CREATE_TOPICS=speak:1:1,environment:1:1,device:1:1,user:1:1,google:1:1,event-stream:1:1,situational-awareness:1:1,integrations:1:1,personality:1:1
    ports:
      - "9092:9092"
    # Healthcheck ensures Kafka is ready to accept connections
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_NAME}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PSWD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./setup/my.cnf:/etc/mysql/conf.d/slow_query.cnf
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PSWD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrate:
    build:
      context: ./setup
      dockerfile: ./migrations/Dockerfile
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      - MYSQL_DATABASE=mysql
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PSWD=${MYSQL_PSWD}
      - MYSQL_NAME=${MYSQL_NAME}

  service-user:
    build:
      context: ./services
      dockerfile: ./service_user/Dockerfile
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_started
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS_1}
      - LOG_LEVEL=${LOG_LEVEL}

  service-api:
    build:
      context: ./services
      dockerfile: ./service_api/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - audio_data:/tmp/audio
      - .:/project:ro
    privileged: true
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS_1}
      - LOG_LEVEL=${LOG_LEVEL}
    expose:
      - "5001"
    ports:
      - "5001:5001"

  service-device:
    build:
      context: ./services
      dockerfile: ./service_device/Dockerfile
    # Host network mode and root required for ARP scanning
    network_mode: host
    restart: unless-stopped
    env_file: .env
    environment:
      - MYSQL_DATABASE=localhost
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS_2}
      - LOG_LEVEL=${LOG_LEVEL}

  service-environment:
    build:
      context: ./services
      dockerfile: ./service_environment/Dockerfile
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_started
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS_1}
      - LOG_LEVEL=${LOG_LEVEL}

  service-speak:
    build:
      context: ./services
      dockerfile: ./service_speak/Dockerfile
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS_1}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - audio_data:/tmp/audio

  service-daemon:
    build:
      context: ./services
      dockerfile: ./service_daemon/Dockerfile
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_started
    network_mode: host
    env_file: .env
    environment:
      - MYSQL_DATABASE=localhost
      - KAFKA_BOOTSTRAP_SERVERS=localhost:9092
      - LOG_LEVEL=${LOG_LEVEL}

  service-frontend:
    build:
      context: ./services/service_frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    user: "1001:1001"
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      service-frontend:
        condition: service_started
      service-api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Separate MySQL instance for testing to avoid interfering with production data
  test-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: testrootpassword
      MYSQL_DATABASE: test_alfr3d_db
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

# Named volumes for persistent data storage
volumes:
  mysql_data:
  audio_data:
  redis_data:
